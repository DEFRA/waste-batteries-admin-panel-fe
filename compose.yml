services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  # Local and CI stand-in for Entra ID; accepts any client secret. Never used
  # in CDP. Discovery is at
  # http://localhost:3210/entra/.well-known/openid-configuration.
  # See "Signing in locally and in CI" in the README
  entra-stub:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    ports:
      - '3210:8080'
    environment:
      JSON_CONFIG_PATH: /entra-stub/config.json
    volumes:
      - ./compose/entra-stub:/entra-stub:ro
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://localhost:8080/entra/.well-known/openid-configuration'
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  frontend:
    build: ./
    ports:
      - '3000:3000'
    links:
      - 'floci:floci'
      - 'redis:redis'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      SESSION_COOKIE_SECURE: false
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
      ENTRA_CLIENT_SECRET: local-client-secret
    networks:
      - cdp-tenant

  # backend:
  #   image: defradigital/your-backend:${YOUR_BACKEND_VERSION:-latest}
  #   ports:
  #     - '3555:3555'
  #   links:
  #     - 'foci:floci'
  #     - 'mongodb:mongodb'
  #   depends_on:
  #     floci:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_started
  #   env_file:
  #     - 'compose/aws.env'
  #   environment:
  #     PORT: 3001
  #     NODE_ENV: development
  #     MONGO_URI: mongodb://mongodb:27017/
  #   networks:
  #     - cdp-tenant

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
