<!doctype html>
<!--
  Sign-in page for the local Entra ID stub (navikt/mock-oauth2-server).
  LOCAL AND CI ONLY: this is not Entra, and it signs in whoever you type.

  The stub serves this file as-is and reads two fields from the POST:
    username  becomes the token's `sub`
    claims    JSON merged into the ID and access tokens

  The claims mirror what Entra puts in an ID token for this app: oid, name,
  preferred_username and, for users assigned an app role, roles.
  See "Signing in locally and in CI" in the README.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Entra ID stub - sign in</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        color: #0b0c0c;
      }
      .banner {
        background: #d4351c;
        color: #fff;
        padding: 10px 16px;
        font-weight: bold;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
      }
      label {
        display: block;
        font-weight: bold;
        margin: 20px 0 5px;
      }
      input[type='text'],
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-size: 16px;
        padding: 5px;
        border: 2px solid #0b0c0c;
      }
      textarea {
        font-family: monospace;
      }
      .hint {
        color: #505a5f;
        margin: 0 0 5px;
      }
      .buttons {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        font-size: 16px;
        padding: 8px 12px;
        cursor: pointer;
      }
      button[type='submit'] {
        background: #00703c;
        color: #fff;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="banner">Local Entra ID stub. Not real Entra ID</div>
    <main>
      <h1>Sign in</h1>
      <p>
        Signs you in to the admin panel as whoever you describe below. Only used
        when running locally and in CI.
      </p>

      <form method="post">
        <label for="username">Username</label>
        <p class="hint">Becomes the token's <code>sub</code>.</p>
        <input
          id="username"
          name="username"
          type="text"
          required
          value="local-admin"
        />

        <label for="claims">ID token claims (JSON)</label>
        <p class="hint">
          Edit these, or pick a preset. <code>roles</code> are Entra app roles.
        </p>
        <textarea id="claims" name="claims" rows="10"></textarea>

        <div class="buttons">
          <button type="button" data-preset="admin">Preset: Admin</button>
          <button type="button" data-preset="noRoles">Preset: no roles</button>
          <button type="submit">Sign in</button>
        </div>
      </form>
    </main>

    <script>
      const presets = {
        admin: {
          username: 'local-admin',
          claims: {
            oid: '00000000-0000-0000-0000-000000000001',
            name: 'Local Admin',
            preferred_username: 'local.admin@defra.onmicrosoft.com',
            roles: ['Admin']
          }
        },
        noRoles: {
          username: 'local-no-roles',
          claims: {
            oid: '00000000-0000-0000-0000-000000000002',
            name: 'Local User',
            preferred_username: 'local.user@defra.onmicrosoft.com',
            roles: []
          }
        }
      }

      function applyPreset(name) {
        document.getElementById('username').value = presets[name].username
        document.getElementById('claims').value = JSON.stringify(
          presets[name].claims,
          null,
          2
        )
      }

      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () =>
          applyPreset(button.dataset.preset)
        )
      })

      applyPreset('admin')
    </script>
  </body>
</html>
